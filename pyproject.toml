[project]
name = "ragmed"
version = "0.1.0"
description = "RAG system for disease diagnosis based on symptoms"
requires-python = ">=3.11"
dependencies = [
    "ollama==0.6.2",
    "requests==2.34.2",
    "beautifulsoup4==4.14.3",
    "rank-bm25==0.2.2",
    "lxml==6.1.0",
    "gradio==6.14.0",
]

[project.scripts]
ragmed = "ragmed_main:run_ragmed"

[tool.uv]
package = false
dev-dependencies = [
    "ruff==0.15.13",
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["Sistema/tests"]
pythonpath = ["Sistema", "Sistema/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["Sistema"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
