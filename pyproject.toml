[project]
name = "ragmed"
version = "0.1.0"
description = "RAG system for disease diagnosis based on symptoms"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "rank-bm25>=0.2.2",
    "lxml>=5.3.0",
]

[project.scripts]
ragmed = "ragmed_main:run_ragmed"

[tool.uv]
package = true
dev-dependencies = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["Sistema"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
